name: 'Nakeuri Foundry Quality Gate'
description: 'High-assurance AI engineering control plane, contract verification, and gatekeeper for Flutter & polyglot repositories.'
author: 'Nakeuri Flutter Foundry contributors'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  task:
    description: 'Nakeuri command to run (e.g. contracts-check, platforms, doctor, standards-status, target-10)'
    required: false
    default: 'contracts-check'
  path:
    description: 'Target repository path'
    required: false
    default: '.'
  python-version:
    description: 'Python version to execute with'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Run Nakeuri Foundry Gate
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        python -m flutter_foundry.cli ${{ inputs.task }} ${{ inputs.path }}
